<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EMA 200 Tiers</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        #chart {
            height: 100%;
            width: 100%;
        }
        .overlay-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            color: #CCCCCC;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            padding: 10px;
            z-index: 1000;
        }
        .overlay-arrow:hover {
            color: #AAAAAA;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .overlay-time {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            color: #CCCCCC;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 8px 12px;
            z-index: 1000;
        }
        .toggle-button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            color: #666666;
            font-size: 14px;
            font-weight: normal;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .toggle-button:hover {
            background-color: rgba(0, 0, 0, 0.9);
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="overlay-arrow" onclick="window.history.back()">&#8592;</div>
    <div class="overlay-time">10-22</div>
    <div class="toggle-button" onclick="toggleATR()" id="toggleBtn">
        ATR
    </div>    
    <div id="chart"></div>
    <script>
        var data = [{"Ticker": "AAPL", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 20.48, "LowPercentage": -20.33, "ClosePercentage": 9.23, "LastRenkoDirection": "O"}, {"Ticker": "LLY", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 18.88, "LowPercentage": -33.1, "ClosePercentage": 16.7, "LastRenkoDirection": "O"}, {"Ticker": "GOOG", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 23.58, "LowPercentage": -38.0, "ClosePercentage": 5.13, "LastRenkoDirection": "O"}, {"Ticker": "AMD", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 61.0, "LowPercentage": -58.11, "ClosePercentage": 33.31, "LastRenkoDirection": "X"}, {"Ticker": "ASML", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 35.73, "LowPercentage": -50.48, "ClosePercentage": 22.77, "LastRenkoDirection": "O"}, {"Ticker": "COST", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 13.62, "LowPercentage": -11.75, "ClosePercentage": -0.26, "LastRenkoDirection": "O"}, {"Ticker": "DELL", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 78.93, "LowPercentage": -59.81, "ClosePercentage": 73.47, "LastRenkoDirection": "X"}, {"Ticker": "CCL", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 23.41, "LowPercentage": -13.26, "ClosePercentage": -0.14, "LastRenkoDirection": "O"}, {"Ticker": "OKTA", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 44.58, "LowPercentage": -41.28, "ClosePercentage": 34.43, "LastRenkoDirection": "O"}, {"Ticker": "DAL", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 25.64, "LowPercentage": -25.35, "ClosePercentage": 16.14, "LastRenkoDirection": "O"}, {"Ticker": "NET", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 46.06, "LowPercentage": -29.28, "ClosePercentage": 34.13, "LastRenkoDirection": "O"}, {"Ticker": "KLAC", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 74.03, "LowPercentage": -51.32, "ClosePercentage": 13.76, "LastRenkoDirection": "O"}, {"Ticker": "UAL", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 25.94, "LowPercentage": -21.16, "ClosePercentage": 11.14, "LastRenkoDirection": "O"}, {"Ticker": "FTNT", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 42.86, "LowPercentage": -36.14, "ClosePercentage": 33.88, "LastRenkoDirection": "O"}, {"Ticker": "HOOD", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 64.26, "LowPercentage": -29.8, "ClosePercentage": 0.5, "LastRenkoDirection": "O"}, {"Ticker": "IBKR", "TradeDate": "2025-08-18", "OpenPercentage": 0, "HighPercentage": 23.39, "LowPercentage": -23.8, "ClosePercentage": 16.1, "LastRenkoDirection": "X"}];
        var optionalHoverColumns = [];

        var colorGreen = '#089981';
        var colorLightGreen = '#66CDAA';
        var colorRed = '#f23645';
        var colorLightRed = '#FF7F7F';

        var xValues = [];
        var openValues = [];
        var highValues = [];
        var lowValues = [];
        var closeValues = [];
        var textValues = [];
        var customData = [];

        data.forEach(function(item) {
            xValues.push(item.Ticker);
            openValues.push(item.OpenPercentage);
            highValues.push(item.HighPercentage);
            lowValues.push(item.LowPercentage);
            closeValues.push(item.ClosePercentage);
            textValues.push(buildHoverText(item));
            customData.push(item.Ticker);
        });

        function formatPercentage(value) {
            return Number(value).toFixed(2);
        }

        function buildHoverText(item) {
            var text =
                item.Ticker + '<br>' +
                'Open: ' + formatPercentage(item.OpenPercentage) + '%<br>' +
                'High: ' + formatPercentage(item.HighPercentage) + '%<br>' +
                'Low: ' + formatPercentage(item.LowPercentage) + '%<br>' +
                'Close: ' + formatPercentage(item.ClosePercentage) + '%<br>';

            optionalHoverColumns.forEach(function(column) {
                text += column + ': ' + item[column] + '<br>';
            });
            return text;
        }

        function createColorTrace(color) {
            var open = [];
            var high = [];
            var low = [];
            var close = [];
            var text = [];
            var custom = [];

            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var itemColor;

                var closeVal = item.ClosePercentage;
                var openVal = item.OpenPercentage;
                var direction = item.LastRenkoDirection;

                if (closeVal > openVal && direction === 'X') {
                    itemColor = colorGreen;
                } else if (closeVal > openVal && direction === 'O') {
                    itemColor = colorLightGreen;
                } else if (closeVal < openVal && direction === 'O') {
                    itemColor = colorRed;
                } else if (closeVal < openVal && direction === 'X') {
                    itemColor = colorLightRed;
                } else {
                    itemColor = '#ffffff';
                }

                if (itemColor === color) {
                    open.push(openValues[i]);
                    high.push(highValues[i]);
                    low.push(lowValues[i]);
                    close.push(closeValues[i]);
                    text.push(textValues[i]);
                    custom.push(customData[i]);
                } else {
                    open.push(null);
                    high.push(null);
                    low.push(null);
                    close.push(null);
                    text.push(null);
                    custom.push(null);
                }
            }

            return {
                x: xValues,
                open: open,
                high: high,
                low: low,
                close: close,
                text: text,
                customdata: custom,
                type: 'candlestick',
                xaxis: 'x',
                yaxis: 'y',
                hoverinfo: 'text',
                increasing: {
                    line: { color: color },
                    fillcolor: color
                },
                decreasing: {
                    line: { color: color },
                    fillcolor: color
                },
                showlegend: false
            };
        }

        var traceGreen = createColorTrace(colorGreen);
        var traceLightGreen = createColorTrace(colorLightGreen);
        var traceRed = createColorTrace(colorRed);
        var traceLightRed = createColorTrace(colorLightRed);

        var traces = [traceGreen, traceLightGreen, traceRed, traceLightRed];

        var layout = {
            autosize: true,
            paper_bgcolor: '#1a1a1a',
            plot_bgcolor: '#1a1a1a',
            font: {
                color: '#ffffff'
            },
            margin: {
                l: 50,
                r: 50,
                b: 50,
                t: 20
            },
            xaxis: {
                title: '',
                type: 'category',
                tickangle: -45,
                tickfont: {
                    color: '#ffffff'
                },
                gridcolor: '#444444',
                showgrid: false
            },
            yaxis: {
                title: '',
                automargin: true,
                tickfont: {
                    color: '#ffffff'
                },
                gridcolor: '#444444'
            }
        };

        var config = {
            responsive: true
        };

        Plotly.newPlot('chart', traces, layout, config);

        // Redirect to ticker detail on click
        var chartDiv = document.getElementById('chart');
        chartDiv.on('plotly_click', function(data) {
            if (data && data.points && data.points.length > 0) {
                var ticker = data.points[0].customdata;
                if (ticker) {
                    window.open('../charts/Open/ticker_v2.html?ticker=' + ticker, '_blank');
                }
            }
        });

        function toggleATR() {
            var currentUrl = window.location.pathname;
            
            if (currentUrl.includes("ATR50")) {
                var newUrl = currentUrl.replace("ATR50", "ATR100");
                window.location.href = newUrl;
            } else if (currentUrl.includes("ATR100")) {
                var newUrl = currentUrl.replace("ATR100", "ATR50");
                window.location.href = newUrl;
            }
        }

        // Show current ATR on button
        document.addEventListener("DOMContentLoaded", function() {
            var btn = document.getElementById("toggleBtn");
            var currentUrl = window.location.pathname;

            if (currentUrl.includes("ATR50")) {
                btn.innerHTML = "50";
            } else if (currentUrl.includes("ATR100")) {
                btn.innerHTML = "100";
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") {
                return;
            }

            if (event.key === "1" || event.code === "Numpad1") {
                toggleATR();
            }
        });
    </script>
</body>
</html>
